{% extends "base.html" %}

{% block title %}Page non trouvée - {{ app_name }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
            <h1 class="display-4 mt-4">404</h1>
            <h2 class="mb-4">Page non trouvée</h2>
            <p class="lead text-muted mb-4">
                Désolé, la page que vous recherchez n'existe pas ou a été déplacée.
            </p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door me-2"></i>Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
