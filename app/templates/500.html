{% extends "base.html" %}

{% block title %}Erreur serveur - {{ app_name }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <i class="bi bi-exclamation-octagon-fill text-danger" style="font-size: 5rem;"></i>
            <h1 class="display-4 mt-4">500</h1>
            <h2 class="mb-4">Erreur interne du serveur</h2>
            <p class="lead text-muted mb-4">
                Une erreur inattendue s'est produite. Nos équipes ont été notifiées et travaillent à résoudre le problème.
            </p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door me-2"></i>Retour à l'accueil
            </a>
        </div>
    </div>
</div>
{% endblock %}
